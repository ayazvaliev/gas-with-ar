seed: 42

model:
  path: pretrained/edm/edm-cifar10-32x32-uncond-vp.pkl
  type: EDM
  conditional: false
  t_eps: null
  guidance_scale: null

dataset:
  teacher_pkl: data/teachers/edm/cifar10/teacher_dataset.pkl
  use_latents: false
  use_condition: false
  train_size: 1400
  batch_size: 24
  validation_batch_size: 128
  validation_size: 1000
  size_vis: 16
  num_workers: 0

teacher_solver_config:
  steps: 20
  order: 3
  time_type: logSNR
  variant: bh1
  t_eps: 0.0001
  guidance_scale: null

student_solver_config:
  steps: null
  order: null
  t_eps: 0.001
  t_parametrization: ar_model
  use_theory_coef: true
  guidance_scale: null

  # Mixed-NFE sampling: ratios for each student step count within a batch.
  # Keys are student NFEs, values are sampling weights (auto-normalised).
  # NFE is randomly assigned per sample at training time.
  steps_ratios:
    "4": 0.5
    "5": 0.5

  loss_config:
    loss_type: null
    loss_key: loss_lpips
    disc_weight: 0.1
    disc_type: CIFAR10
    disc_lr: 0.00001

  ar_config:
    d_model: 128
    dim_ff: 128
    nhead: 4
    dropout: 0

training:
  n_iters: 5000
  lr: 0.001
  iters_to_accumulate: 1
  ema_decay: 0.999

logging:
  project_name: GAS
  eval_freq: 500
  checkpoint_freq: 500
  log_weights_freq: 10
  run_name: ar_mixed_nfe_4_5
